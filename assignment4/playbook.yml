---
- name: Install and configure Nginx
  hosts: host
  become: true

  tasks:

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Change Nginx port from 80 to 8081
      replace:
        path: /etc/nginx/sites-available/default
        regexp: 'listen 80 default_server;'
        replace: 'listen 8081 default_server;'
      notify: Restart Nginx

    - name: Change IPv6 Nginx port from 80 to 8081
      replace:
        path: /etc/nginx/sites-available/default
        regexp: 'listen \[::\]:80 default_server;'
        replace: 'listen [::]:8081 default_server;'
      notify: Restart Nginx

    - name: Deploy application
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>My Ansible Application</title>
          </head>
          <body>
              <h1>Welcome to My Application</h1>
              <p>Deployed using Ansible.</p>
              <p>Nginx is running on port 8081.</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: true

  handlers:

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
